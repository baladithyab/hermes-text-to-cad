[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-text-to-cad"
version = "0.1.0"
description = "Verified text-to-CAD plugin for Hermes Agent: closed-loop parametric model generation with numeric + multi-model vision gates."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "baladithyab" }]
requires-python = ">=3.10"
dependencies = [
  "cadquery>=2.7",
  "trimesh>=4.0",
  "scipy>=1.10",
  "numpy>=1.24",
  "vtk>=9.3",
  "matplotlib>=3.7",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
all = []

[project.urls]
Homepage = "https://github.com/baladithyab/hermes-text-to-cad"

# Use find (not an explicit list) so file-modules vs dir-packages never drift.
[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_text_to_cad*"]
exclude = ["tests*"]
